    <path d="M945 128 C1010 128, 1022 278, 1080 278" stroke="#F59E0B" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="3.2s" repeatCount="indefinite"/></path>
