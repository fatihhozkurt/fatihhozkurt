  <text x="108" y="168" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="760" letter-spacing="-1.5">Fatih Özkurt</text>
  <text x="110" y="211" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">Building reliable, maintainable and scalable backend systems.</text>
  <text x="110" y="252" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Java  •  Spring Boot  •  Data  •  Messaging  •  API Communication</text>
