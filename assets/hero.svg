    <circle r="3.6" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="2.3s" repeatCount="indefinite" path="M945 128 C1015 128, 1020 78, 1080 78"/></circle>
    <circle r="3.3" fill="#FB923C" filter="url(#glow)"><animateMotion dur="2.7s" repeatCount="indefinite" path="M945 128 C1015 128, 1020 178, 1080 178"/></circle>
