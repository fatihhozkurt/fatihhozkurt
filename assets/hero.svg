    <linearGradient id="accent" x1="88" y1="0" x2="620" y2="0"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#FB923C"/></linearGradient>
    <filter id="blur40" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8B949E" stroke-opacity=".055" stroke-width="1"/></pattern>
    <linearGradient id="fadeBottom" x1="700" y1="285" x2="700" y2="360"><stop stop-color="#0D1117" stop-opacity="0"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
  </defs>
  <rect width="1400" height="360" rx="24" fill="url(#bg)"/>
