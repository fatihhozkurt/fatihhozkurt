  <rect width="1400" height="360" rx="24" fill="url(#amberGlow)"><animate attributeName="opacity" values=".72;1;.72" dur="7s" repeatCount="indefinite"/></rect>
  <ellipse cx="940" cy="335" rx="430" ry="160" fill="url(#softGlow)" filter="url(#blur40)"><animate attributeName="cx" values="890;1010;890" dur="11s" repeatCount="indefinite"/></ellipse>
  <rect x="76" y="64" width="5" height="198" rx="2.5" fill="url(#accent)"/>
