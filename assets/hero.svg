<svg width="1000" height="250" viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="960" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset=".52" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 35) rotate(135) scale(340 250)">
      <stop stop-color="#F59E0B" stop-opacity=".40"/>
      <stop offset=".42" stop-color="#F59E0B" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(730 235) rotate(-35) scale(330 180)">
      <stop stop-color="#FB923C" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8B949E" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="248" rx="20" fill="url(#bg)" stroke="#21262D"/>
  <rect x="1" y="1" width="998" height="248" rx="20" fill="url(#grid)"/>

  <ellipse cx="860" cy="35" rx="330" ry="210" fill="url(#g1)">
    <animate attributeName="cx" values="820;890;820" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;58;30" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="735" cy="230" rx="320" ry="150" fill="url(#g2)" filter="url(#blur)">
    <animate attributeName="cx" values="680;790;680" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- identity -->
  <rect x="70" y="55" width="4" height="137" rx="2" fill="url(#accent)"/>
  <circle cx="72" cy="55" r="4.2" fill="#F59E0B" filter="url(#glow)">
    <animate attributeName="opacity" values=".5;1;.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <text x="100" y="78" fill="#F59E0B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2.4">JAVA BACKEND DEVELOPER</text>
  <text x="96" y="132" fill="#F0F6FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="760" letter-spacing="-1">Fatih Özkurt</text>
  <text x="98" y="168" fill="#C9D1D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500">Building reliable, maintainable and scalable backend systems.</text>
  <text x="98" y="199" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">Java  •  Spring Boot  •  Microservices  •  API Communication</text>

  <!-- relation graph -->
  <g stroke="#F59E0B" stroke-linecap="round">
    <path d="M705 108 C755 108, 770 72, 820 72" stroke-opacity=".22" stroke-width="1.4" stroke-dasharray="7 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-34" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M705 108 C755 108, 770 150, 820 150" stroke-opacity=".18" stroke-width="1.25" stroke-dasharray="7 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-34" dur="4.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle r="3.5" fill="#F59E0B" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M705 108 C755 108, 770 72, 820 72"/>
  </circle>
  <circle r="3" fill="#FB923C" filter="url(#glow)">
    <animateMotion dur="4.1s" repeatCount="indefinite" path="M705 108 C755 108, 770 150, 820 150"/>
  </circle>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700">
    <!-- Java core -->
    <rect x="585" y="80" width="120" height="44" rx="14" fill="#111827" stroke="#2B3541"/>
    <circle cx="610" cy="102" r="6" fill="#F59E0B"/>
    <text x="626" y="107" fill="#F0F6FC">Java</text>

    <!-- Spring Boot -->
    <rect x="820" y="50" width="150" height="44" rx="14" fill="#111827" stroke="#2B3541"/>
    <circle cx="845" cy="72" r="6" fill="#6DB33F"/>
    <text x="861" y="77" fill="#F0F6FC">Spring Boot</text>

    <!-- Microservices -->
    <rect x="820" y="128" width="150" height="44" rx="14" fill="#111827" stroke="#2B3541"/>
    <circle cx="845" cy="150" r="6" fill="#60A5FA"/>
    <text x="861" y="155" fill="#F0F6FC">Microservices</text>

    <circle cx="705" cy="108" r="4" fill="#F59E0B" filter="url(#glow)"/>
  </g>
</svg>
