<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090D12"/><stop offset="0.48" stop-color="#0D1117"/><stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1160 75) rotate(128) scale(420 560)">
      <stop stop-color="#F59E0B" stop-opacity=".34"/><stop offset=".42" stop-color="#D97706" stop-opacity=".12"/><stop offset="1" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 330) rotate(-28) scale(480 260)">
      <stop stop-color="#F59E0B" stop-opacity=".14"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
