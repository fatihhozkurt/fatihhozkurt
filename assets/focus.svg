<svg width="1000" height="170" viewBox="0 0 1000 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="170">
      <stop stop-color="#0B0F14"/>
      <stop offset=".55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="flow" x1="185" y1="92" x2="785" y2="92">
      <stop stop-color="#F59E0B"/>
      <stop offset=".5" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="998" height="168" rx="18" fill="url(#bg)" stroke="#21262D"/>
  <text x="55" y="38" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing="2">CURRENT FOCUS</text>
  <line x1="215" y1="92" x2="785" y2="92" stroke="#30363D" stroke-width="2"/>
  <line x1="215" y1="92" x2="785" y2="92" stroke="url(#flow)" stroke-opacity=".45" stroke-width="2" stroke-dasharray="10 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.8s" repeatCount="indefinite"/>
  </line>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <circle cx="215" cy="92" r="31" fill="#161B22" stroke="#F59E0B" stroke-width="2"/>
      <text x="215" y="98" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="700">gRPC</text>
    </g>
    <g>
      <circle cx="500" cy="92" r="40" fill="#161B22" stroke="#F59E0B" stroke-opacity=".75" stroke-width="2"/>
      <text x="500" y="89" text-anchor="middle" fill="#F0F6FC" font-size="14.5" font-weight="700">Protocol</text>
      <text x="500" y="107" text-anchor="middle" fill="#F0F6FC" font-size="14.5" font-weight="700">Buffers</text>
    </g>
    <g>
      <circle cx="785" cy="92" r="31" fill="#161B22" stroke="#F59E0B" stroke-opacity=".55" stroke-width="2"/>
      <text x="785" y="98" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="700">HTTP/2</text>
    </g>
  </g>
  <circle r="4.3" fill="#F59E0B" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M215 92 H785"/>
  </circle>
  <text x="500" y="151" text-anchor="middle" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">distributed systems  ·  concurrency  ·  async processing  ·  backend performance</text>
</svg>
